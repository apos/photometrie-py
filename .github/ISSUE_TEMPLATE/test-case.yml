name: Test Case
description: New test case for the reusable test case catalog
title: "[Test Case] TC-<PROJECT>-<ref>-01: "
labels: ["test-case"]
body:
  - type: markdown
    attributes:
      value: |
        A test case is a **reusable definition** — not an execution result and not a Pass/Fail.
        See [CONVENTIONS.md](../../CONVENTIONS.md) for how to use it.

        **ID convention — replace the placeholders in the title above before submitting:**
        `TC-<PROJECT>-<ref>-<NN>: <short description>`
        - `<PROJECT>`: short project code (e.g. `PFSM` for PiFinder_Stellarmate)
        - `<ref>`: the issue number this test case relates to (e.g. `79`), or a short topic slug if
          it isn't tied to one issue (e.g. `INDIONLY`)
        - `<NN>`: two-digit sequence number, starting at `01` for this `<ref>` (increment if a
          second, distinct test case is created for the same `<ref>`)
        - Example: `TC-PFSM-79-01: Auto-correct (Sync) — reproduce oscillation from an IMU-interpolated position`

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >
        A few sentences: what is this about, what does this test case verify? Distill this from
        the Reference below — whoever opens this test case should not have to go read the linked
        issue first just to know what's going on.
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: Reference (Requirement / Issue / Feature)
      description: Traceability — what does this test case relate to?
    validations:
      required: false

  - type: input
    id: test-type
    attributes:
      label: Test Type / Category
      description: >
        e.g. functional, regression, smoke, installation — determines which set:* label(s)
        should be added to the issue.
    validations:
      required: false

  - type: textarea
    id: precondition
    attributes:
      label: Precondition
      description: State that must be true before testing starts.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Test Steps
      description: >
        Numbered, exact steps — no paraphrasing. Give an expected result only for steps where
        something checkable happens; pure navigation/setup steps stay without their own result.
      placeholder: |
        1. ...
           Expected: ...
        2. ...
        3. ...
           Expected: ...
    validations:
      required: true

  - type: textarea
    id: postcondition
    attributes:
      label: Postcondition
      description: State after a successful test run.
    validations:
      required: false
